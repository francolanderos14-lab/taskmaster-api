apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmaster-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskmaster-api
  template:
    metadata:
      labels:
        app: taskmaster-api
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: taskmaster-api
          image: 345843270501.dkr.ecr.us-east-1.amazonaws.com/taskmaster-api:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: taskmaster-api-service
spec:
  type: NodePort
  selector:
    app: taskmaster-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080